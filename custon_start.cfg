[gcode_macro START_PRINT]
variable_prepare: 0

gcode:
  RESPOND MSG="Custom START_PRINT aktiv"

  CLEAR_PAUSE

  {% set bed_temp = params.BED_TEMP|default(60)|float %}
  {% set extruder_temp = params.EXTRUDER_TEMP|default(200)|float %}

  # Temperaturen starten
  M140 S{bed_temp}
  M104 S{extruder_temp}

  # Homing
  G28

  # Bett auf Temperatur warten
  M190 S{bed_temp}

  # Genaues Z-Homing (K1 Sensor)
  ACCURATE_G28

  # Mesh laden / erzeugen
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE

  # Extruder auf Temperatur
  M109 S{extruder_temp}

  # Prime Line
  G92 E0
  G90

  G1 Z2 F600
  G1 X10 Y10 F6000

  G1 Z0.3 F600
  G1 X10 Y250 E15 F1500

  G92 E0

  RESPOND MSG="START_PRINT fertig"